name: Validate veterinary database

on:
  push:
    paths:
      - 'data/drugs.json'
      - 'data/sources.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schema basics
        run: |
          python - <<'PY'
          import json
          with open('data/drugs.json', encoding='utf-8') as f:
              d=json.load(f)
          assert isinstance(d.get('drugs'), list)
          assert d.get('database_version')
          assert d.get('schema_version') == '3.0'
          for x in d['drugs']:
              assert x.get('generic_name_zh')
              for dose in x.get('dosages', []):
                  assert dose.get('source'), x.get('generic_name_zh')
          print('OK:', len(d['drugs']), 'drug records')
          PY
