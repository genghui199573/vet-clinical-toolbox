name: Validate veterinary toolbox 5.0
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 5.0 files
        run: |
          python - <<'PY'
          import json, pathlib
          r=pathlib.Path('.')
          idx=(r/'index.html').read_text(encoding='utf-8')
          assert '兽医临床工具箱 5.0' in idx
          db=json.loads((r/'data/drugs.json').read_text(encoding='utf-8'))
          assert isinstance(db.get('drugs'),list)
          cat=r/'data/vet_drug_catalog_5.0.json'
          assert cat.exists()
          json.loads(cat.read_text(encoding='utf-8'))
          src=json.loads((r/'sources.v5.0.json').read_text(encoding='utf-8'))
          assert src['schema_version']=='5.0'
          print('5.0 validation OK; drugs:',len(db['drugs']))
          PY
