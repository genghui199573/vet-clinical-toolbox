name: Validate veterinary database

on:
  push:
    paths:
      - 'drugs.json'
      - 'sources.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON schema basics
        run: |
          python - <<'PY'
          import json

          with open('drugs.json', encoding='utf-8') as f:
              d = json.load(f)

          assert isinstance(d.get('drugs'), list)
          assert d.get('database_version')
          assert d.get('schema_version') == '3.0'

          for x in d['drugs']:
              assert x.get('generic_name_zh')
              assert isinstance(x.get('dosages', []), list)

              for dose in x.get('dosages', []):
                  assert dose.get('source')
                  assert dose.get('species')

          print("OK:", len(d['drugs']), "drug records")
          PY
