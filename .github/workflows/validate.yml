name: Validate veterinary database

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate database
        run: |
          python - <<'PY'
          import json

          with open("drugs.json", encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data.get("drugs"), list)
          assert data.get("database_version")
          assert data.get("schema_version") == "3.0"

          for drug in data["drugs"]:
              assert drug.get("generic_name_zh")
              assert isinstance(drug.get("dosages", []), list)

          print("Database validation passed.")
          print("Drug records:", len(data["drugs"]))
          PY
