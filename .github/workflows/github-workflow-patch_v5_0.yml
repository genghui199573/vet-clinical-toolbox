name: Vet Toolbox 5.0 runtime repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair 5.0 bootstrap and enhancement loading order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          enhancement='<script src="clinical_enhancements_5.0.js"></script>'
          addon='<script src="clinical_enhancements_5.0_clinical_addon.js"></script>'
          bootstrap="""<script id="vet5-bootstrap">
(function(){
  const dose=document.getElementById('dose');
  if(!dose || document.getElementById('reconstituteBtn')) return;
  const card=document.createElement('div');
  card.className='card';
  card.id='reconstituteCard';
  card.innerHTML=`<h2>粉针复溶 / 抽取量</h2><div class="grid"><div>
    <label>物种<select id="rwSpecies"><option>犬</option><option>猫</option><option>鹦鹉/鸟类</option><option>兔/啮齿类</option><option>爬宠/龟鳖</option></select></label>
    <label>品种<input id="rwBreed"></label><label>体重 kg<input id="rwWeight" type="number" step=".01"></label>
    <label>目标剂量<input id="rwDose" type="number" step=".001"></label><label>剂量单位<select id="rwDoseUnit"><option>mg/kg</option><option>µg/kg</option></select></label>
    <label>每瓶总药量<input id="vialAmount" type="number" step=".001"></label><label>药量单位<select id="vialUnit"><option>mg</option><option>g</option><option>µg</option></select></label>
    </div><div><label>稀释液加入量 mL<input id="diluentVolume" type="number" step=".1"></label>
    <label>复溶后最终体积 mL<input id="finalVolume" type="number" step=".1"></label>
    <button class="primary" id="reconstituteBtn" type="button">计算复溶后抽取量</button><div id="reOut"></div></div></div>`;
  dose.appendChild(card);
})();
</script>"""
          main_marker='<script>\n"use strict";'

          if 'id="vet5-bootstrap"' not in s:
              if enhancement in s:
                  s=s.replace(enhancement,bootstrap+'\n'+enhancement,1)
              elif main_marker in s:
                  s=s.replace(main_marker,bootstrap+'\n'+main_marker,1)
              else:
                  raise SystemExit('main script marker not found')

          if enhancement not in s:
              if main_marker not in s:
                  raise SystemExit('main script marker not found')
              s=s.replace(main_marker,enhancement+'\n'+main_marker,1)

          if addon not in s:
              if enhancement in s:
                  s=s.replace(enhancement,enhancement+'\n'+addon,1)
              else:
                  raise SystemExit('clinical_enhancements_5.0.js tag not found')

          p.write_text(s,encoding='utf-8')
          print('5.0 bootstrap and clinical addon loading repaired')
          PY

      - name: Commit repair
        run: |
          git config user.name "vet-toolbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed."
          else
            git commit -m "feat: extend 5.0 clinical runtime without version change"
            git push
          fi
