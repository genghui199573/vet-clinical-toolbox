name: Migrate veterinary database to v3.2

on:
  workflow_dispatch:
  push:
    paths:
      - "data/drugs.json"
      - "drugs.v3.2-core.json"
      - ".github/workflows/migrate-v3.2.yml"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate 3.1 database to 3.2
        shell: python
        run: |
          import json
          import re
          from pathlib import Path
          from copy import deepcopy

          OLD = Path("data/drugs.json")
          CORE = Path("drugs.v3.2-core.json")
          OUT = Path("data/drugs.v3.2.json")

          def load_json(path):
              with path.open("r", encoding="utf-8") as f:
                  return json.load(f)

          old_db = load_json(OLD)
          core_db = load_json(CORE) if CORE.exists() else {"drugs": []}

          old_drugs = old_db.get("drugs", [])
          core_drugs = core_db.get("drugs", [])

          def slug(text):
              text = str(text or "").strip().lower()
              text = re.sub(r"[^a-z0-9\u4e00-\u9fff]+", "-", text)
              return text.strip("-") or "unknown"

          def as_list(value):
              if isinstance(value, list):
                  return value
              if value is None or value == "":
                  return []
              return [value]

          def species_group(species):
              s = str(species or "")

              if any(x in s for x in ["犬", "猫"]):
                  return "犬猫"

              if any(x in s for x in ["牛", "羊", "山羊", "猪", "马", "驴"]):
                  return "经济动物/大动物"

              if any(x in s for x in ["禽", "鸡", "鸭", "鹅", "火鸡"]):
                  return "禽类"

              if any(x in s for x in ["鸟", "鹦鹉", "鸽", "雀"]):
                  return "鸟类"

              if any(x in s for x in ["龟", "蜥蜴", "蛇", "爬宠", "守宫"]):
                  return "爬宠"

              if any(x in s for x in ["兔", "仓鼠", "豚鼠", "鼠"]):
                  return "小型哺乳动物"

              return "其他"

          def convert_dosage(d, dosage):
              species = dosage.get("species", "")
              indication = dosage.get("indication", "")

              raw_dose = dosage.get("dose")
              dose_numeric = None

              if isinstance(raw_dose, (int, float)):
                  dose_numeric = raw_dose

              record = {
                  "species_group": species_group(species),
                  "species": species,
                  "indication": indication,
                  "route": dosage.get("route", ""),
                  "dose": dose_numeric,
                  "dose_unit": "",
                  "frequency": "",
                  "duration": "",
                  "dose_basis": dosage.get("status", ""),
                  "dose_notes": (
                      str(raw_dose)
                      if raw_dose is not None and not isinstance(raw_dose, (int, float))
                      else ""
                  ),
                  "label_status": dosage.get("status", "未注明"),
                  "monitoring": [],
                  "source_ids": []
              }

              source = dosage.get("source", "")
              if source:
                  record["source_ids"] = [f"legacy-{slug(source)}"]

              return record

          def convert_drug(d):
              records = []

              for dosage in as_list(d.get("dosages")):
                  if isinstance(dosage, dict):
                      records.append(convert_dosage(d, dosage))

              clinical_categories = []

              if d.get("class"):
                  clinical_categories.append(d["class"])

              new_drug = {
                  "id": d.get("id"),
                  "generic_name_zh": d.get("generic_name_zh", ""),
                  "generic_name_en": d.get("generic_name_en", ""),
                  "aliases": as_list(d.get("aliases")),
                  "brand_names": as_list(d.get("brand_names")),

                  "pharmacologic_class": d.get(
                      "pharmacologic_class",
                      d.get("class", "")
                  ),

                  "clinical_categories": clinical_categories,

                  "species_groups": sorted(
                      list({
                          species_group(x)
                          for x in as_list(d.get("species"))
                      })
                  ),

                  "indications_general": sorted(
                      list({
                          x.get("indication", "")
                          for x in as_list(d.get("dosages"))
                          if isinstance(x, dict) and x.get("indication")
                      })
                  ),

                  "indication_keywords": [],
                  "search_terms": [],

                  "evidence_grade": d.get("evidence_grade", ""),

                  "use_type": d.get("use_type", ""),

                  "records": records,

                  "special_warnings": as_list(
                      d.get("warnings", [])
                  ),

                  "contraindications": as_list(
                      d.get("contraindications", [])
                  )
              }

              return new_drug

          migrated = {}

          # 先迁移现有 3.1 数据
          for drug in old_drugs:
              if not isinstance(drug, dict):
                  continue

              converted = convert_drug(drug)

              if converted.get("id"):
                  migrated[converted["id"]] = converted

          # 再合并 v3.2 core
          for drug in core_drugs:
              if not isinstance(drug, dict):
                  continue

              drug_id = drug.get("id")

              if not drug_id:
                  continue

              if drug_id not in migrated:
                  migrated[drug_id] = deepcopy(drug)

              else:
                  current = migrated[drug_id]

                  # 补充缺失字段，但不覆盖旧数据库已有内容
                  for key, value in drug.items():
                      if key not in current or current[key] in ("", [], None):
                          current[key] = deepcopy(value)

                  # 合并 records
                  old_records = current.get("records", [])
                  new_records = drug.get("records", [])

                  if isinstance(old_records, list) and isinstance(new_records, list):
                      existing_keys = {
                          (
                              r.get("species"),
                              r.get("indication"),
                              r.get("route"),
                              str(r.get("dose"))
                          )
                          for r in old_records
                          if isinstance(r, dict)
                      }

                      for r in new_records:
                          if not isinstance(r, dict):
                              continue

                          key = (
                              r.get("species"),
                              r.get("indication"),
                              r.get("route"),
                              str(r.get("dose"))
                          )

                          if key not in existing_keys:
                              old_records.append(deepcopy(r))

                      current["records"] = old_records

          final_db = {
              "schema_version": "3.2",
              "database_version": "2026.08.11-v3.2-migrated",
              "last_reviewed": "2026-08-11",

              "policy": {
                  "no_guessing": True,
                  "official_vet_label_is_separate": True,
                  "dose_requires_source": True,
                  "off_label_must_be_marked": True,
                  "food_animal_withdrawal_period_requires_official_source": True
              },

              "drugs": list(migrated.values())
          }

          OUT.parent.mkdir(parents=True, exist_ok=True)

          with OUT.open("w", encoding="utf-8") as f:
              json.dump(
                  final_db,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Migration completed.")
          print(f"Old records: {len(old_drugs)}")
          print(f"Core records: {len(core_drugs)}")
          print(f"Final records: {len(final_db['drugs'])}")
          print(f"Output: {OUT}")

      - name: Basic JSON validation
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("data/drugs.v3.2.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          assert data["schema_version"] == "3.2"
          assert isinstance(data["drugs"], list)

          for drug in data["drugs"]:
              assert isinstance(drug, dict)
              assert "id" in drug
              assert "generic_name_zh" in drug
              assert "records" in drug
              assert isinstance(drug["records"], list)

          print("Basic validation passed.")
          print("Drug count:", len(data["drugs"]))

      - name: Upload migrated database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: veterinary-drugs-v3.2-migrated
          path: data/drugs.v3.2.json
          if-no-files-found: error
