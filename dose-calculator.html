<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>兽医临床工具箱 3.7｜剂量计算器</title>
<style>
body{margin:0;background:#f4f7f7;color:#172126;font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}header{background:#0f766e;color:#fff;padding:16px}main{max-width:920px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce5e6;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}label{display:block;color:#68777d;font-size:13px;margin:9px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd6d9;border-radius:9px;box-sizing:border-box;font:inherit}button{border:0;border-radius:9px;padding:10px 14px;margin-top:10px;cursor:pointer}.p{background:#0f766e;color:#fff}.s{background:#eef5f4;border:1px solid #cfe2df}.r{background:#effaf7;border:1px solid #a5d8ce;border-radius:10px;padding:12px;margin-top:10px}.w{background:#fff7ed;border:1px solid #fed7aa;color:#8a4b00;border-radius:10px;padding:11px;margin-top:10px}.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:11px;margin-top:10px}
</style></head><body><header><h1>兽医临床工具箱 3.7｜剂量计算器</h1><div>只负责数学换算，不决定药物剂量。</div></header><main>
<div class="card"><h2>mg/kg → mg / mL</h2><div class="grid"><div><label>体重 kg</label><input id="w" type="number" step=".01"></div><div><label>剂量 mg/kg</label><input id="d" type="number" step=".001"></div><div><label>浓度 mg/mL</label><input id="c" type="number" step=".001"></div><div><label>每日次数</label><input id="f" type="number" step="1" value="1"></div></div><button class="p" onclick="dose()">计算</button><button class="s" onclick="clr()">清空</button><div id="o"></div></div>
<div class="card"><h2>总量 → 体积</h2><div class="grid"><div><label>总药量 mg</label><input id="tm" type="number" step=".001"></div><div><label>浓度 mg/mL</label><input id="tc" type="number" step=".001"></div></div><button class="p" onclick="vol()">换算</button><div id="vo"></div></div>
<div class="card"><h2>CRI / 输液泵数学换算</h2><div class="grid"><div><label>目标剂量 单位/kg/h</label><input id="cd" type="number" step=".001"></div><div><label>体重 kg</label><input id="cw" type="number" step=".01"></div><div><label>药液总单位</label><input id="ct" type="number" step=".001"></div><div><label>最终体积 mL</label><input id="cv" type="number" step=".1"></div></div><button class="p" onclick="cri()">计算</button><div id="co"></div></div>
<div class="card"><h3>安全边界</h3><ul><li>剂量、浓度、频次必须来自可靠来源。</li><li>mg、mL、U、IU、mEq、mmol不可混用。</li><li>U-40/U-100/U-300胰岛素必须匹配对应制剂与器具。</li><li>计算器只会把输入的数字准确算出来，不会判断数字是否适合病例。</li></ul><div class="w">超说明书用药、特殊物种、肝肾功能异常、妊娠/哺乳和联合用药必须单独复核。</div></div>
</main><script>
const n=id=>Number(document.getElementById(id).value),f=x=>Number.isFinite(x)?(Math.round(x*1000)/1000):"—";
function dose(){const w=n("w"),d=n("d"),c=n("c"),q=n("f");if(!(w>0&&d>=0&&c>0)){document.getElementById("o").innerHTML='<div class="bad">请输入完整数据。</div>';return}const mg=w*d,ml=mg/c;document.getElementById("o").innerHTML=`<div class="r">单次：<b>${f(mg)} mg</b>；<b>${f(ml)} mL</b><br>每日：${f(mg*q)} mg；${f(ml*q)} mL</div>`}
function clr(){["w","d","c","tm","tc","cd","cw","ct","cv"].forEach(x=>document.getElementById(x).value="");["o","vo","co"].forEach(x=>document.getElementById(x).innerHTML="")}
function vol(){const m=n("tm"),c=n("tc");if(!(m>=0&&c>0)){document.getElementById("vo").innerHTML='<div class="bad">请输入完整数据。</div>';return}document.getElementById("vo").innerHTML=`<div class="r">体积：<b>${f(m/c)} mL</b></div>`}
function cri(){const d=n("cd"),w=n("cw"),u=n("ct"),v=n("cv");if(!(d>=0&&w>0&&u>0&&v>0)){document.getElementById("co").innerHTML='<div class="bad">请输入完整数据。</div>';return}const conc=u/v,rate=w*d/conc;document.getElementById("co").innerHTML=`<div class="r">溶液浓度：${f(conc)} 单位/mL；泵速：<b>${f(rate)} mL/h</b></div>`}
</script></body></html>
